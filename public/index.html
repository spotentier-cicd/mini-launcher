<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#0c0e11" />
<meta name="description" content="Local dashboard to start, stop and open your Node projects." />
<title>Control panel — local projects</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230c0e11'/><path d='M13 10l9 6-9 6Z' fill='%2334d3bd'/></svg>" />
<link rel="stylesheet" href="style.css" />
<script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 5.14v13.72L19 12 8 5.14Z" />
        </svg>
      </span>
      <div class="topbar-title">
        <h1>Control panel</h1>
        <p id="subtitle">loading projects…</p>
      </div>
    </div>

    <div class="topbar-actions">
      <button id="refresh" class="btn ghost" type="button" title="Reload the project list">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-2.6-6.4" />
          <path d="M21 3v6h-6" />
        </svg>
        Refresh
      </button>

      <form id="logout" method="post" action="/logout" hidden>
        <button class="btn ghost" type="submit" title="End the session">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <path d="m16 17 5-5-5-5" />
            <path d="M21 12H9" />
          </svg>
          Log out
        </button>
      </form>
    </div>
  </header>

  <main id="board" class="board">
    <p class="empty">Loading…</p>
    <noscript>
      <p class="empty">This dashboard needs JavaScript to list and control your projects.</p>
    </noscript>
  </main>

  <dialog class="modal" id="confirm" aria-labelledby="confirm-title">
    <form method="dialog" class="modal-card">
      <h2 class="modal-title" id="confirm-title"></h2>
      <p class="modal-text" id="confirm-text"></p>
      <div class="modal-actions">
        <button class="btn ghost" type="submit" value="cancel" autofocus>Cancel</button>
        <button class="btn danger" type="submit" value="confirm" id="confirm-ok"></button>
      </div>
    </form>
  </dialog>

  <template id="row-template">
    <article class="row" data-id="">
      <div class="row-main">
        <span class="dot" aria-hidden="true"></span>

        <div class="row-text">
          <div class="row-head">
            <h2 class="row-name"></h2>
            <p class="row-port"></p>
          </div>
          <p class="row-path"></p>
        </div>

        <div class="row-actions">
          <a class="btn open" target="_blank" rel="noopener noreferrer">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15 3h6v6" />
              <path d="M10 14 21 3" />
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h6" />
            </svg>
            Open
          </a>

          <select class="script-select" aria-label="npm script to run"></select>

          <button class="btn start" type="button">
            <svg class="icon solid icon-start" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 5.14v13.72L19 12 8 5.14Z" />
            </svg>
            <svg class="icon icon-restart" viewBox="0 0 24 24" aria-hidden="true" hidden>
              <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
              <path d="M21 3v5h-5" />
              <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
              <path d="M3 21v-5h5" />
            </svg>
            <span class="start-label">Start</span>
          </button>

          <button class="btn stop danger" type="button">
            <svg class="icon solid" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="7" y="7" width="10" height="10" rx="2" />
            </svg>
            Stop
          </button>

          <button class="btn logs-toggle ghost" type="button" aria-expanded="false">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m4 17 6-6-6-6" />
              <path d="M12 19h8" />
            </svg>
            Logs
          </button>
        </div>
      </div>

      <pre class="logs hidden" tabindex="0" aria-label="Process output"></pre>
    </article>
  </template>
</body>
</html>
